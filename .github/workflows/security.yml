name: Security

on:
  pull_request:
  merge_group:
    types: [checks_requested]
  workflow_dispatch:
    inputs:
      full-history:
        description: Scan the whole history for secrets, not only a pull request's commits
        type: boolean
        default: true
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: read

jobs:
  call-security:
    uses: EasyLife365/.github/.github/workflows/security_gate.yml@main
    with:
      full-history: ${{ inputs.full-history || false }}
      node: true
      node-package-manager: npm
